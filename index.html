<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Background Demos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .nav {
      display: flex;
      gap: 8px;
      padding: 16px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #40424D;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav button {
      padding: 8px 20px;
      border: 1px solid #40424D;
      background: transparent;
      color: #9DA2B3;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .nav button:hover,
    .nav button.active {
      background: #1E1E24;
      color: #EDEFF7;
      border-color: #6E7180;
    }

    .demo {
      display: none;
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .demo.active {
      display: block;
    }

    .hero-text {
      position: absolute;
      left: 80px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      max-width: 600px;
      pointer-events: none;
    }

    .hero-text h1 {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
      color: #EDEFF7;
    }

    .hero-text h1 span {
      color: #9DA2B3;
    }

    .hero-text p {
      font-size: 16px;
      color: #6E7180;
      line-height: 1.6;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .left-fade {
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      z-index: 5;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 50%, transparent 100%);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div class="nav">
    <button class="active" onclick="show('dots', this)">1. Dot Grid</button>
    <button onclick="show('wiregrid', this)">2. Wire Grid</button>
    <button onclick="show('cubes', this)">3. Cubes</button>
    <button onclick="show('wave', this)">4. Wave</button>
    <button onclick="show('hexagons', this)">5. Hexagons</button>
    <button onclick="show('diamonds', this)">6. Diamonds</button>
    <button onclick="show('neural', this)">7. Neural Net</button>
    <button onclick="show('triangles', this)">8. Triangles</button>
    <button onclick="show('orbits', this)">9. Orbits</button>
  </div>


  <!-- DEMO 5: Hexagons -->
  <div class="demo" id="demo-hexagons">
    <canvas id="canvas-hexagons"></canvas>
    <div class="left-fade"></div>
    <div class="hero-text">
      <h1>Building the data backbone <span>for Physical AI.</span></h1>
      <p>We build large-scale egocentric, multimodal datasets that power robotics, wearable AI, and embodied
        intelligence.</p>
    </div>
  </div>


  <script>
    let currentDemo = 'dots';
    const mouse = { x: -9999, y: -9999 };
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    function show(name, btn) {
      document.querySelectorAll('.demo').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('demo-' + name).classList.add('active');
      btn.classList.add('active');
      currentDemo = name;
    }

    function setupCanvas(id) {
      const c = document.getElementById(id);
      const ctx = c.getContext('2d');
      function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
      resize();
      window.addEventListener('resize', resize);
      return { c, ctx };
    }

    function seeded(i) { let s = i * 9301 + 49297; return ((s * s) % 233280) / 233280; }

    // ===== DEMO 5: 3D Hexagons =====
    (function () {
      const { c, ctx } = setupCanvas('canvas-hexagons');
      const R = 35; // hex radius
      const GAP = 6;
      const maxDist = 280;
      const DEPTH = 14;

      function hexPoints(cx, cy, r) {
        const pts = [];
        for (let i = 0; i < 6; i++) {
          const angle = Math.PI / 6 + (Math.PI / 3) * i; // flat-top
          pts.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
        }
        return pts;
      }

      function drawHexPath(ctx, pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
      }

      function draw() {
        if (currentDemo !== 'hexagons') { requestAnimationFrame(draw); return; }
        ctx.clearRect(0, 0, c.width, c.height);

        const time = Date.now() * 0.001;
        const w = (R + GAP) * Math.sqrt(3);
        const h = (R + GAP) * 1.5;
        const cols = Math.ceil(c.width / w) + 2;
        const rows = Math.ceil(c.height / h) + 2;

        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const idx = row * cols + col;
            if (seeded(idx) < 0.08) continue;

            const cx = col * w + (row % 2) * w * 0.5;
            const cy = row * h;

            const dist = Math.hypot(mouse.x - cx, mouse.y - cy);
            const influence = Math.max(0, 1 - dist / maxDist);
            const inf2 = influence * influence;

            const floatY = Math.sin(time * 0.6 + seeded(idx + 30) * 6.28) * 2;
            const fy = cy + floatY;

            const baseBright = 0.05 + seeded(idx + 80) * 0.05;
            const bright = baseBright + inf2 * 0.4;
            const d = DEPTH * (0.3 + inf2 * 0.7);

            const pts = hexPoints(cx, fy, R);

            // 3D side faces (extrude bottom 3 edges)
            for (let i = 2; i <= 4; i++) {
              const p1 = pts[i];
              const p2 = pts[(i + 1) % 6];
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineTo(p2.x, p2.y + d);
              ctx.lineTo(p1.x, p1.y + d);
              ctx.closePath();
              ctx.fillStyle = `rgba(100, 110, 140, ${bright * 0.6})`;
              ctx.fill();
              ctx.strokeStyle = `rgba(150, 160, 190, ${bright * 0.3})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }

            // Top face
            drawHexPath(ctx, pts);
            ctx.fillStyle = `rgba(60, 65, 85, ${bright * 1.2})`;
            ctx.fill();

            // Border glow
            drawHexPath(ctx, pts);
            ctx.strokeStyle = `rgba(170, 180, 210, ${bright * 0.6 + inf2 * 0.5})`;
            ctx.lineWidth = 0.8 + inf2 * 1.2;
            ctx.stroke();

            // Inner glow on hover
            if (inf2 > 0.05) {
              const grd = ctx.createRadialGradient(cx, fy, 0, cx, fy, R * 1.3);
              grd.addColorStop(0, `rgba(190, 200, 230, ${inf2 * 0.2})`);
              grd.addColorStop(0.5, `rgba(150, 160, 195, ${inf2 * 0.08})`);
              grd.addColorStop(1, 'transparent');
              drawHexPath(ctx, pts);
              ctx.fillStyle = grd;
              ctx.fill();

              // Light peaking from behind (bottom glow)
              const glowGrd = ctx.createRadialGradient(cx, fy + d, 0, cx, fy + d, R * 1.8);
              glowGrd.addColorStop(0, `rgba(200, 210, 240, ${inf2 * 0.25})`);
              glowGrd.addColorStop(0.4, `rgba(160, 170, 200, ${inf2 * 0.1})`);
              glowGrd.addColorStop(1, 'transparent');
              ctx.fillStyle = glowGrd;
              ctx.fillRect(cx - R * 2, fy - R, R * 4, R * 2 + d * 2);
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();


  </script>
</body>

</html>
